substitutions:
  name: office-desk
  tx_pin: GPIO16
  rx_pin: GPIO17
  screen_pin: GPIO2

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

esphome:
  name: ${name}
  friendly_name: "Office Desk"
  on_boot:
    priority: -100
    then:
      - delay: 10s
      - logger.log: "Boot complete — UART monitoring active"

logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_fallback_password

captive_portal:

web_server:
  port: 80

uart:
  - id: desk_uart
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    debug:
      direction: BOTH
      dummy_receiver: true
      after:
        timeout: 50ms
      sequence:
        - lambda: UARTDebug::log_hex(direction, bytes, ':');

switch:
  - platform: gpio
    name: "PIN 20 Wake"
    id: pin20_wake
    pin:
      number: ${screen_pin}
      mode: OUTPUT
    restore_mode: ALWAYS_ON
    entity_category: config

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

button:
  - platform: restart
    name: "Restart"
    entity_category: config
